name: StandBy
options:
  bundleIdPrefix: com.monstandby
  deploymentTarget:
    iOS: "17.0"

targets:
  StandBy:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: StandBy
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppleMusicUsageDescription: "L'app affiche et contrôle la musique en cours de lecture."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monstandby.app
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
